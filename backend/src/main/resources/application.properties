spring.application.name=fraud-tracker

# Read the root .env file as extra properties if it exists (local dev only)
spring.config.import=optional:file:../.env[.properties]

# Datasource: env var first, local default second
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fraud_tracker}
spring.datasource.username=${DB_USER:fraud_app}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema. Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Local only: show DB status in the health endpoint. Revisit before deploy.
management.endpoint.health.show-details=always