services:
  db:
    image: postgres:16
    container_name: fraud-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_tracker
      POSTGRES_USER: fraud_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: